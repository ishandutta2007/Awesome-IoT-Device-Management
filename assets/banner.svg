<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" style="background:#090d16; border-radius:12px; overflow:hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes ripple {
      0% { r: 12px; opacity: 0.8; }
      100% { r: 55px; opacity: 0; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; fill: #38bdf8; }
      50% { opacity: 1; fill: #34d399; }
    }
    @keyframes packetFlow1 {
      0% { cx: 720px; cy: 140px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 860px; cy: 80px; opacity: 0; }
    }
    @keyframes packetFlow2 {
      0% { cx: 720px; cy: 140px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 870px; cy: 200px; opacity: 0; }
    }
    .glow-circle { transform-origin: 720px 140px; animation: pulseGlow 4s ease-in-out infinite; }
    .wave1 { transform-origin: 720px 140px; animation: ripple 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
    .wave2 { transform-origin: 720px 140px; animation: ripple 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.5s; }
    .conn-line { stroke-dasharray: 6 4; animation: dashMove 3s linear infinite; }
    .node-pulse { animation: nodeBlink 2.5s ease-in-out infinite alternate; }
    .node-pulse-delay { animation: nodeBlink 2.5s ease-in-out infinite 1.25s alternate; }
    .packet1 { animation: packetFlow1 2.8s linear infinite; }
    .packet2 { animation: packetFlow2 3.2s linear infinite 0.7s; }
  </style>

  <!-- Background Layer -->
  <rect width="960" height="280" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="220" x2="960" y2="220" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
    <line x1="640" y1="0" x2="640" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
  </g>

  <!-- Ambient background glow blobs -->
  <circle cx="120" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glowSoft)" />
  <circle cx="720" cy="140" r="130" fill="#6366f1" opacity="0.12" filter="url(#glowSoft)" />

  <!-- Left Side: Typography and Info -->
  <g transform="translate(60, 0)">
    <!-- Badge -->
    <g transform="translate(0, 48)">
      <rect width="186" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="13" r="4" fill="#34d399" />
      <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="118" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome IoT Device Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Fleet Operations  •  Secure OTA  •  Edge Orchestration  •  Telemetry
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 182)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="45" y="16" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ SaaS &amp; Cloud</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(100, 0)">
        <rect width="102" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="51" y="16" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔓 Open Source</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(212, 0)">
        <rect width="96" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="48" y="16" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📦 Edge &amp; OTA</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(318, 0)">
        <rect width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="52" y="16" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🌐 MQTT / Cloud</text>
      </g>
    </g>

    <text x="0" y="242" fill="#64748b" font-family="sans-serif" font-size="11">
      Continuous updates for platform engineers &amp; hardware architects
    </text>
  </g>

  <!-- Right Side: Interactive Animated Topology Diagram -->
  <g>
    <!-- Background pulse aura -->
    <circle cx="720" cy="140" r="45" fill="#38bdf8" class="glow-circle" filter="url(#glow)" />

    <!-- Expanding Radar Waves -->
    <circle cx="720" cy="140" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" class="wave1" />
    <circle cx="720" cy="140" r="18" fill="none" stroke="#818cf8" stroke-width="1.5" class="wave2" />

    <!-- Connecting Network Lines -->
    <line x1="720" y1="140" x2="620" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" class="conn-line" />
    <line x1="720" y1="140" x2="860" y2="80" stroke="#818cf8" stroke-width="1.5" opacity="0.6" class="conn-line" />
    <line x1="720" y1="140" x2="870" y2="200" stroke="#34d399" stroke-width="1.5" opacity="0.6" class="conn-line" />
    <line x1="720" y1="140" x2="630" y2="210" stroke="#f472b6" stroke-width="1.5" opacity="0.6" class="conn-line" />
    <line x1="720" y1="140" x2="740" y2="45" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" class="conn-line" />

    <!-- Inter-node mesh connections -->
    <line x1="620" y1="70" x2="740" y2="45" stroke="#334155" stroke-width="1" opacity="0.5" />
    <line x1="740" y1="45" x2="860" y2="80" stroke="#334155" stroke-width="1" opacity="0.5" />
    <line x1="860" y1="80" x2="870" y2="200" stroke="#334155" stroke-width="1" opacity="0.5" />
    <line x1="870" y1="200" x2="630" y2="210" stroke="#334155" stroke-width="1" opacity="0.5" />
    <line x1="630" y1="210" x2="620" y2="70" stroke="#334155" stroke-width="1" opacity="0.5" />

    <!-- Animated Data Packets -->
    <circle cx="720" cy="140" r="3.5" fill="#38bdf8" class="packet1" filter="url(#glow)" />
    <circle cx="720" cy="140" r="3.5" fill="#34d399" class="packet2" filter="url(#glow)" />

    <!-- Satellite Nodes -->
    <!-- Node 1: Edge -->
    <g transform="translate(620, 70)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" class="node-pulse" />
      <text x="0" y="27" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">EDGE</text>
    </g>

    <!-- Node 2: OTA -->
    <g transform="translate(860, 80)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#818cf8" class="node-pulse-delay" />
      <text x="0" y="27" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">OTA</text>
    </g>

    <!-- Node 3: Telemetry -->
    <g transform="translate(870, 200)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#34d399" class="node-pulse" />
      <text x="0" y="27" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">DATA</text>
    </g>

    <!-- Node 4: Fleet -->
    <g transform="translate(630, 210)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f472b6" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#f472b6" class="node-pulse-delay" />
      <text x="0" y="27" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">FLEET</text>
    </g>

    <!-- Node 5: Gateway -->
    <g transform="translate(740, 45)">
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#a78bfa" class="node-pulse" />
      <text x="0" y="-16" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">GATEWAY</text>
    </g>

    <!-- Central Control Hub -->
    <g transform="translate(720, 140)">
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
      <polygon points="0,-12 11,-5 11,8 0,14 -11,8 -11,-5" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="1" r="3.5" fill="#34d399" />
      <text x="0" y="40" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">HUB</text>
    </g>
  </g>
</svg>